packages:
  - apps/*
  - packages/*

patchedDependencies:
  '@tanstack/virtual-core@3.0.0-beta.26': patches/pnpm/@tanstack+virtual-core+3.0.0-beta.26.patch
  forcefocus@1.1.0: patches/pnpm/forcefocus+1.1.0.patch
  vite-plugin-electron@0.28.7: patches/pnpm/vite-plugin-electron+0.28.7.patch
  wql-process-monitor@3.0.1: patches/pnpm/wql-process-monitor+3.0.1.patch

overrides:
  node-gyp: ^12.3.0
  '@electron/rebuild>node-abi': ^4.40.0
  prebuild-install>node-abi: ^4.40.0
  # Keep the SDK's optional peer independent of jsdom's undici 8 dependency.
  'openai@7.45.0>undici': 7.30.1
  # Preserve c12's declared peer graph; coverage keeps its own magicast dependency.
  'c12@3.3.4>magicast': '-'

minimumReleaseAgeExclude:
  # The vendored RC is hash-pinned and intentionally not published to npm.
  - electron-game-overlay@0.1.0-rc.2
  - gelectron
  - electron@46.0.0-alpha.2
  - '@aws-sdk/client-cognito-identity@3.1157.0'
  - '@aws-sdk/client-polly@3.1157.0'
  - '@aws-sdk/client-transcribe-streaming@3.1157.0'
  - '@aws-sdk/client-translate@3.1157.0'
  - '@aws-sdk/core@3.978.6'
  - '@aws-sdk/credential-provider-cognito-identity@3.972.76'
  - '@aws-sdk/credential-provider-env@3.972.77'
  - '@aws-sdk/credential-provider-http@3.972.79'
  - '@aws-sdk/credential-provider-ini@3.973.22'
  - '@aws-sdk/credential-provider-login@3.972.84'
  - '@aws-sdk/credential-provider-node@3.972.89'
  - '@aws-sdk/credential-provider-process@3.972.77'
  - '@aws-sdk/credential-provider-sso@3.973.21'
  - '@aws-sdk/credential-provider-web-identity@3.972.83'
  - '@aws-sdk/credential-providers@3.1157.0'
  - '@aws-sdk/eventstream-handler-node@3.972.39'
  - '@aws-sdk/middleware-eventstream@3.972.34'
  - '@aws-sdk/middleware-sdk-transcribe-streaming@3.972.37'
  - '@aws-sdk/middleware-websocket@3.972.59'
  - '@aws-sdk/nested-clients@3.997.51'
  - '@aws-sdk/token-providers@3.1157.0'
  - '@smithy/core@3.37.0'
  - '@smithy/node-http-handler@4.13.0'
  - openai@7.45.0

allowBuilds:
  '@infisical/cli': true
  '@parcel/watcher': true
  bufferutil: true
  electron: true
  electron-winstaller: true
  es5-ext: true
  esbuild: true
  forcefocus: true
  koffi: true
  nx: true
  protobufjs: true
  utf-8-validate: true
  vue-demi: true
  wql-process-monitor: true
